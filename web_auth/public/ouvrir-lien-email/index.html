<!-- KidsRelay · ouvrir-lien-email · 2026-08-22
     Page d'accès au compte, servie par https://auth.kidsrelay.fr/
     Source de référence : web_auth/public/ dans le dépôt.
     Contrôle de conformité : node web_auth/verifier-deploiement.mjs -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#1f4a3f" />
<title>Votre compte KidsRelay</title>
<style>
  /* Toute l'identité visuelle tient dans ces variables : restyler la
     page plus tard revient à changer ces valeurs, sans toucher au
     balisage ni au script.

     Ce sont les couleurs de KidsRelay, les mêmes que dans
     lib/theme/kidsrelay_theme.dart côté application. Un parent qui
     arrive ici depuis un email doit reconnaître d'où vient la page :
     c'est ce qui distingue une vraie page d'une imitation.

     Le rouge d'urgence #C0392B n'apparaît pas ici, volontairement :
     il est réservé aux consignes vitales dans l'application. Un lien
     de connexion périmé est une contrariété, pas une urgence — d'où
     l'ambre.

     Les polices de KidsRelay ne sont pas chargées : il faudrait
     déposer des fichiers supplémentaires chez OVH et alourdir une page
     que l'on ouvre trois secondes depuis un téléphone. La pile
     système suffit ; ce sont les couleurs qui portent la
     reconnaissance. */
  :root {
    --texte: #26302c;
    --texte-doux: #5f6b66;
    --fond: #f5f3ef;
    --carte: #ffffff;
    --bordure: #d9d5ce;
    --accent: #1f4a3f;
    --accent-texte: #ffffff;
    --alerte-fond: #fbf1df;
    --alerte-bordure: #e8c98a;
    --alerte-texte: #26302c;
    --succes-fond: #eaf2ed;
    --succes-bordure: #b8d0c4;
    --rayon: 8px;
    --largeur: 460px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  main {
    max-width: var(--largeur);
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 20px;
  }

  p { margin: 0 0 16px; }

  .discret {
    color: var(--texte-doux);
    font-size: 14px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .champ { margin-bottom: 20px; }

  .saisie {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--bordure);
    border-radius: var(--rayon);
    background: var(--fond);
  }

  .saisie:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.15);
  }

  input[type="password"], input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 12px 14px;
    font-size: 16px;
    color: inherit;
    border-radius: var(--rayon);
  }

  input:focus { outline: none; }

  .oeil {
    border: 0;
    background: transparent;
    padding: 0 14px;
    cursor: pointer;
    color: var(--texte-doux);
    font-size: 13px;
  }

  .oeil:hover { color: var(--texte); }

  button.principal {
    width: 100%;
    border: 0;
    border-radius: var(--rayon);
    background: var(--accent);
    color: var(--accent-texte);
    padding: 14px;
    font-size: 16px;
    cursor: pointer;
  }

  button.principal[disabled] {
    opacity: 0.6;
    cursor: default;
  }

  a.principal {
    display: block;
    text-align: center;
    text-decoration: none;
    border-radius: var(--rayon);
    background: var(--accent);
    color: var(--accent-texte);
    padding: 14px;
    font-size: 16px;
  }

  .encart {
    border-radius: var(--rayon);
    padding: 16px;
    margin-bottom: 24px;
    border: 1px solid var(--bordure);
    background: var(--carte);
  }

  .encart.erreur {
    background: var(--alerte-fond);
    border-color: var(--alerte-bordure);
    color: var(--alerte-texte);
  }

  .encart.succes {
    background: var(--succes-fond);
    border-color: var(--succes-bordure);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="titre">Votre compte KidsRelay</h1>

  <p id="chargement" class="discret">Vérification du lien…</p>

  <div id="encart-erreur" class="encart erreur" hidden></div>

  <section id="formulaire" hidden>
    <p>Choisissez votre nouveau mot de passe.</p>

    <div class="champ">
      <label for="mot-de-passe">Nouveau mot de passe</label>
      <div class="saisie">
        <input id="mot-de-passe" type="password" autocomplete="new-password" />
        <button type="button" class="oeil" data-cible="mot-de-passe">
          Afficher
        </button>
      </div>
      <p class="discret" style="margin: 6px 0 0">8 caractères minimum.</p>
    </div>

    <div class="champ">
      <label for="confirmation">Confirmer le mot de passe</label>
      <div class="saisie">
        <input id="confirmation" type="password" autocomplete="new-password" />
        <button type="button" class="oeil" data-cible="confirmation">
          Afficher
        </button>
      </div>
    </div>

    <button id="valider" type="button" class="principal">Valider</button>
  </section>

  <section id="succes" hidden>
    <div class="encart succes">
      <p id="succes-titre" style="margin: 0; font-weight: 600"></p>
    </div>
    <p id="succes-detail"></p>
    <a class="principal" href="kidsrelay://auth-callback">
      Ouvrir l’application
    </a>
    <p class="discret" style="margin-top: 16px">
      Si rien ne se passe, ouvrez l’application KidsRelay depuis votre
      téléphone.
    </p>
  </section>
</main>

<script type="module">
  import {
    demarrer,
    soumettreMotDePasse,
  } from './auth-lien.js';

  // Renseignés à la main : ce sont les mêmes valeurs publiques que
  // celles embarquées dans l'application (lib/config/supabase_config.dart).
  // La clé "publishable" est conçue pour vivre côté client ; la
  // protection réelle est assurée par les règles RLS.
  const API_URL = 'https://xcugfdjaifdibwowlrpi.supabase.co';
  const API_KEY = 'sb_publishable_3j5-ynSda2sUBJD6my4KEQ_-_gICd11';

  const elements = {
    chargement: document.getElementById('chargement'),
    erreur: document.getElementById('encart-erreur'),
    formulaire: document.getElementById('formulaire'),
    succes: document.getElementById('succes'),
    succesTitre: document.getElementById('succes-titre'),
    succesDetail: document.getElementById('succes-detail'),
    motDePasse: document.getElementById('mot-de-passe'),
    confirmation: document.getElementById('confirmation'),
    valider: document.getElementById('valider'),
  };

  function afficherErreur(message) {
    elements.erreur.textContent = message;
    elements.erreur.hidden = false;
  }

  function masquerErreur() {
    elements.erreur.hidden = true;
  }

  function afficherSucces(titre, detail) {
    elements.formulaire.hidden = true;
    masquerErreur();
    elements.succesTitre.textContent = titre;
    elements.succesDetail.textContent = detail;
    elements.succes.hidden = false;
  }

  for (const bouton of document.querySelectorAll('.oeil')) {
    bouton.addEventListener('click', () => {
      const champ = document.getElementById(bouton.dataset.cible);
      const masque = champ.type === 'password';

      champ.type = masque ? 'text' : 'password';
      bouton.textContent = masque ? 'Masquer' : 'Afficher';
      champ.focus();
    });
  }

  const fragment = window.location.hash;

  // Le jeton disparaît de la barre d'adresse et de l'historique dès
  // qu'il est lu : il ne reste visible ni par-dessus l'épaule, ni dans
  // un partage d'écran.
  history.replaceState(null, '', window.location.pathname);

  const vue = await demarrer({
    fragment,
    fetch: window.fetch.bind(window),
    apiUrl: API_URL,
    apiKey: API_KEY,
  });

  elements.chargement.hidden = true;

  if (vue.type === 'erreur') {
    afficherErreur(vue.message);
  } else if (vue.type === 'compte-confirme') {
    document.getElementById('titre').textContent = 'Compte confirmé';
    afficherSucces(
      'Votre compte est confirmé.',
      'Vous pouvez maintenant vous connecter dans l’application '
      + 'KidsRelay.',
    );
  } else {
    document.getElementById('titre').textContent =
      'Nouveau mot de passe';
    elements.formulaire.hidden = false;

    elements.valider.addEventListener('click', async () => {
      masquerErreur();
      elements.valider.disabled = true;
      elements.valider.textContent = 'Enregistrement…';

      const resultat = await soumettreMotDePasse({
        fetch: window.fetch.bind(window),
        apiUrl: API_URL,
        apiKey: API_KEY,
        accessToken: vue.accessToken,
        motDePasse: elements.motDePasse.value,
        confirmation: elements.confirmation.value,
      });

      if (resultat.ok) {
        document.getElementById('titre').textContent =
          'Mot de passe modifié';
        afficherSucces(
          'Votre mot de passe a été modifié.',
          'Retournez dans l’application KidsRelay pour vous connecter '
          + 'avec ce nouveau mot de passe.',
        );
        return;
      }

      afficherErreur(resultat.message);
      elements.valider.disabled = false;
      elements.valider.textContent = 'Valider';
    });
  }
</script>
</body>
</html>
